"sql/2026-10-19-session-context.sqlite.sql" = "agent_bot/resources/2026-10-19-session-context.sqlite.sql"
"sql/2026-10-20-retire-legacy-session-context.sql" = "agent_bot/resources/2026-10-20-retire-legacy-session-context.sql"
"sql/2026-10-20-retire-legacy-session-context.sqlite.sql" = "agent_bot/resources/2026-10-20-retire-legacy-session-context.sqlite.sql"
