# agentBot 仓库根目录流水线：检查通过后构建，生产部署需手动触发。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [check, package, image, deploy]

default:
  interruptible: true

variables:
  UV_VERSION: "0.11.2"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: "copy"
  # 部署作业必须由能访问 192.168.1.5 的内网 Docker Runner 执行。
  DEPLOY_RUNNER_TAG: "linux-lan"
  WINDOWS_RUNNER_TAG: "windows"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DOCKER_VERSION: "29.9.0"

.python:
  image: python:3.12-slim-bookworm
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache/]
  before_script:
    - python -m pip install --no-cache-dir "uv==$UV_VERSION"
    - uv sync --locked --extra dev

python-check:
  extends: .python
  stage: check
  script:
    - uv run --no-sync ruff check .
    # 禁止执行会清空真实配置的数据库测试；其他失败仍会阻断发布。
    - uv run --no-sync pytest -m "not e2e" -k "not database_onebot_token_reaches_adapter_without_log_disclosure" --allow-hosts=127.0.0.1,::1 --junitxml=reports/pytest.xml --cov-report=xml:reports/coverage.xml
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/pytest.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml

frontend-check:
  stage: check
  image: node:22-bookworm-slim
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]
  script:
    - npm --prefix web ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm --prefix web run typecheck
    - npm --prefix web test -- --run
    - npm --prefix web run build
  artifacts:
    expire_in: 7 days
    paths: [src/static/]

deployment-check:
  stage: check
  image: "docker:${DOCKER_VERSION}-cli"
  script:
    - apk add --no-cache bash shellcheck
    - bash -n tools/ci/deploy-via-ssh.sh deploy/deploy.sh
    - shellcheck tools/ci/deploy-via-ssh.sh deploy/deploy.sh
    # 只解析模板，不读取服务器凭据，也不启动容器。
    - export AGENTBOT_IMAGE=agentbot:ci AGENTBOT_RUNTIME_ENV_FILE="$CI_PROJECT_DIR/deploy/runtime.env.example"
    - docker compose -f deploy/compose.yaml config --quiet

package:
  extends: .python
  stage: package
  needs: [python-check, frontend-check, deployment-check]
  script:
    - uv build --out-dir dist-ci
    - uv run --no-sync python tools/check_package.py dist-ci/*.whl
  artifacts:
    expire_in: 14 days
    paths: [dist-ci/]

# Windows 安装器使用原生 shell Runner；手动构建不会阻塞仅有 Linux Runner 的 Web 发布。
windows-installer:
  stage: package
  tags: ["$WINDOWS_RUNNER_TAG"]
  needs:
    - job: python-check
      artifacts: false
    - job: frontend-check
      artifacts: false
    - job: deployment-check
      artifacts: false
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/)'
      when: manual
      allow_failure: true
  script:
    - '$ErrorActionPreference = "Stop"'
    - '& uv --version; if ($LASTEXITCODE -ne 0) { throw "Windows Runner 未安装 uv" }'
    - '& powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_windows.ps1 -BuildInstaller; if ($LASTEXITCODE -ne 0) { throw "Windows 安装包构建失败" }'
    # 无需交互桌面，通过临时 SQLite 验收打包后的真实后端。
    - '& uv run --locked --extra dev --extra desktop python tools/check_windows.py dist/windows/AgentBot --first-run; if ($LASTEXITCODE -ne 0) { throw "Windows 包首次启动验收失败" }'
  artifacts:
    name: "agentbot-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist/windows/AgentBot/
      - dist/windows/installer/*-Setup.exe
      - dist/windows/installer/SHA256SUMS.txt

container-image:
  stage: image
  image: "docker:${DOCKER_VERSION}-cli"
  services:
    - name: "docker:${DOCKER_VERSION}-dind"
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  needs: [package]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/)'
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull --build-arg "UV_VERSION=$UV_VERSION" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    # 部署传递不可变摘要；不依赖可移动的 latest 标签。
    - printf 'AGENTBOT_IMAGE=%s\n' "$(docker inspect --format='{{index .RepoDigests 0}}' "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA")" > image.env
  artifacts:
    expire_in: 14 days
    reports:
      dotenv: image.env

deploy-production:
  stage: deploy
  image: alpine:3.22
  tags: ["$DEPLOY_RUNNER_TAG"]
  needs: [container-image]
  interruptible: false
  resource_group: agentbot-production
  environment:
    name: production
    url: http://192.168.1.5:8080
  variables:
    DEPLOY_HOST: "192.168.1.5"
    DEPLOY_PORT: "22"
    DEPLOY_PATH: "/opt/agentbot"
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/)'
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache bash openssh-client
  script:
    - bash tools/ci/deploy-via-ssh.sh
