"sql/startup-versioning.sql" = "agent_bot/resources/startup-versioning.sql"
"sql/startup-versioning.sqlite.sql" = "agent_bot/resources/startup-versioning.sqlite.sql"
"sql/UPGRADE-AUTOMATIC.md" = "agent_bot/resources/UPGRADE-AUTOMATIC.md"
"sql/bilibili-init.sql" = "agent_bot/resources/bilibili-init.sql"
"sql/bilibili-init.sqlite.sql" = "agent_bot/resources/bilibili-init.sqlite.sql"
