[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "agent-bot"
version = "0.5.0"
description = "Independent Agent bot service with browser administration"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "editables>=0.5,<1",
  "jsonschema>=4.26,<5.0",
  "httpx2>=2.13.1,<3.0",
  "httpcore>=1.0.9,<2.0",
  "anyio>=4.0,<5.0",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.12,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.28.1,<1.0",
  "mcp>=2.0.0,<3.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0",
  "nonebot2[fastapi,websockets]>=2.5.0,<3.0",
  "pillow>=11.0,<13.0",
  "pymysql>=1.1,<2.0",
  "redis>=5.2,<7.0",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-ollama>=1,<2",
  "langgraph>=1,<2",
  "langsmith>=0.14,<1",
]

[project.scripts]
agent-bot = "agent_bot.__main__:main"
chat = "agent_bot.bot_cli:main"

[project.optional-dependencies]
dev = [
  "nonebug>=0.4.3,<1.0",
  "fakeredis>=2.31,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<8.0",
  "pytest-socket>=0.7,<1.0",
  "pyyaml>=6.0,<7.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build]
exclude = [
  "/AGENTS.md", "/.superpowers", "/.venv", "/web/node_modules",
  "/.pytest_cache", "/.ruff_cache", "/.coverage*", "/dist",
  "/.env", "/.env.*",
  "/data", "/logs", "/tts", "*.log", "tts-*.wav",
  "*.db", "*.sqlite", "*.sqlite3", "*-wal", "*-shm", "*-journal",
  ".pytest-*-results.txt", ".ruff-*-results.txt",
  "/dist-ci", "/reports", "/.uv-cache", "/.npm", "/deploy/runtime.env", "/image.env",
]
artifacts = ["src/static/**"]

# 只把根目录示例加入源码包，避免否定通配规则重新纳入本地基线中的同名文件。
[tool.hatch.build.targets.sdist.force-include]
".env.example" = ".env.example"

[tool.hatch.build.targets.wheel]
# 源码按用户约定平铺在 src，发布和可编辑安装均映射为 agent_bot 包。
only-include = ["src"]
sources = { "src" = "agent_bot" }
# Hatch 的自动检测不支持重命名目录，由下方构建钩子显式登记开发包。
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"sql/2026-10-13-unified-call-records.sql" = "agent_bot/resources/2026-10-13-unified-call-records.sql"
"sql/2026-10-13-unified-call-records.sqlite.sql" = "agent_bot/resources/2026-10-13-unified-call-records.sqlite.sql"
"sql/agent_bot_init.sql" = "agent_bot/resources/agent_bot_init.sql"
"sql/agent_bot_init.sqlite.sql" = "agent_bot/resources/agent_bot_init.sqlite.sql"
"sql/2026-10-13-chat-index-names.sql" = "agent_bot/resources/2026-10-13-chat-index-names.sql"
"sql/2026-10-13-dynamic-provider-mcp-credentials.sql" = "agent_bot/resources/2026-10-13-dynamic-provider-mcp-credentials.sql"
# 旧分阶段资源仍可读取，供既有部署按版本显式升级；新安装使用统一脚本。
"sql/legacy/agent_bot_ai_init.sql" = "agent_bot/resources/agent_bot_ai_init.sql"
"sql/legacy/agent_bot_agent_init.sql" = "agent_bot/resources/agent_bot_agent_init.sql"
"sql/legacy/agent_bot_media_init.sql" = "agent_bot/resources/agent_bot_media_init.sql"
"sql/2026-10-12-agentbot-schema-comments.sql" = "agent_bot/resources/2026-10-12-agentbot-schema-comments.sql"
"sql/2026-10-12-python-jobs-auto-speak.sql" = "agent_bot/resources/2026-10-12-python-jobs-auto-speak.sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--cov=agent_bot",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "integration: NoneBot integration without external services",
  "e2e: requires a real NapCatQQ and QQ account",
]

[tool.coverage.run]
source = ["agent_bot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".superpowers", "web/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
allowed-confusables = ["，", "；", "！", "？", "："]

[tool.ruff.lint.per-file-ignores]
"src/plugin/__init__.py" = ["B008"]
"src/plugin/handlers.py" = ["B008"]

[tool.ruff.lint.isort]
# 平铺目录通过构建映射获得包名，显式标明第一方包以保持既有导入顺序。
known-first-party = ["agent_bot"]
