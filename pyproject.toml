[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--cov=agent_bot",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "integration: NoneBot integration without external services",
  "e2e: requires a real NapCatQQ and QQ account",
]

[tool.coverage.run]
source = ["agent_bot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".superpowers", "web/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
allowed-confusables = ["，", "；", "！", "？", "："]

[tool.ruff.lint.per-file-ignores]
"src/plugin/__init__.py" = ["B008"]
"src/plugin/handlers.py" = ["B008"]
# 当前标准包路径沿用原 QQ 模块的 NoneBot 依赖注入例外，不扩大到其他插件。
"src/agent_bot/plugin/handlers.py" = ["B008"]

[tool.ruff.lint.isort]
# 平铺目录通过构建映射获得包名，显式标明第一方包以保持既有导入顺序。
known-first-party = ["agent_bot"]
