[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "agent-bot"
version = "0.5.10"
description = "Independent Agent bot service with browser administration"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "editables>=0.5,<1",
  "jsonschema>=4.26,<5.0",
  "httpx2>=2.13.1,<3.0",
  "httpcore>=1.0.9,<2.0",
  "anyio>=4.0,<5.0",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.12,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.28.1,<1.0",
  "mcp>=2.0.0,<3.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0",
  "nonebot2[fastapi,websockets]>=2.5.0,<3.0",
  "pillow>=11.0,<13.0",
  "pymysql>=1.1,<2.0",
  "pywin32>=311; sys_platform == 'win32'",
  "redis>=5.2,<7.0",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-ollama>=1,<2",
  "langgraph>=1,<2",
  "langsmith>=0.14,<1",
]

[project.scripts]
agent-bot = "agent_bot.__main__:main"
chat = "agent_bot.bot_cli:main"

[project.optional-dependencies]
desktop = [
  "pywebview>=6.0,<7; sys_platform == 'win32'",
]
dev = [
  "nonebug>=0.4.3,<1.0",
  "fakeredis>=2.31,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<8.0",
  "pytest-socket>=0.7,<1.0",
  "pyyaml>=6.0,<7.0",
  "ruff>=0.12,<1.0",
]

[dependency-groups]
windows-build = ["pyinstaller>=6.16,<7; sys_platform == 'win32'"]

[tool.hatch.build]
exclude = [
  "/AGENTS.md", "/.superpowers", "/.venv", "/web/node_modules",
  "/.pytest_cache", "/.ruff_cache", "/.coverage*", "/dist", "/build",
  "/.env", "/.env.*",
  "/data", "/logs", "/tts", "*.log", "tts-*.wav",
  "/runtime", "/prepared", "/deploy/NapCat.Shell.zip",
  "*.db", "*.sqlite", "*.sqlite3", "*-wal", "*-shm", "*-journal",
  ".pytest-*-results.txt", ".ruff-*-results.txt",
  "/dist-ci", "/reports", "/.uv-cache", "/.npm", "/deploy/runtime.env", "/image.env",
]
artifacts = ["src/static/**"]

# 只把根目录示例加入源码包，避免否定通配规则重新纳入本地基线中的同名文件。
[tool.hatch.build.targets.sdist.force-include]
".env.example" = ".env.example"
# 日期命名的迁移脚本被 Git 忽略规则排除，源码包必须显式保留完整 SQL 基线。
"sql" = "sql"
# 内置工作流目录允许被 Git 忽略，但源码包重建 wheel 时仍必须提供。
"src/resources" = "src/resources"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "tools/build_hook.py"

[tool.hatch.build.targets.wheel]
# 当前源码位于 src/agent_bot，资源目录通过下方规则放到同一发布包。
only-include = ["src/agent_bot"]
sources = { "src" = "" }
# Hatch 的自动检测不支持重命名目录，由下方构建钩子显式登记开发包。
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"sql/agent-personality.sql" = "agent_bot/resources/agent-personality.sql"
"sql/agent-personality.sqlite.sql" = "agent_bot/resources/agent-personality.sqlite.sql"
"sql/material-classification.sql" = "agent_bot/resources/material-classification.sql"
"sql/material-classification.sqlite.sql" = "agent_bot/resources/material-classification.sqlite.sql"
"sql/2026-10-28-comfy-plugin.sql" = "agent_bot/resources/2026-10-28-comfy-plugin.sql"
