# 默认业务库与队列使用持久卷中的 SQLite；可显式选择已有 MySQL/Redis 服务。
services:
  agentbot:
    image: ${AGENTBOT_IMAGE:?必须指定待部署的镜像或摘要}
    env_file:
      - ${AGENTBOT_RUNTIME_ENV_FILE:?必须指定服务器运行配置文件绝对路径}
    restart: unless-stopped
    init: true
    stop_grace_period: 180s
    # 发布到指定局域网网卡；使用反向代理时可改成 127.0.0.1。
    ports:
      - "${AGENTBOT_BIND_ADDRESS:-192.168.1.5}:${AGENTBOT_HTTP_PORT:-8080}:8080"
    volumes:
      - agentbot-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  # 固定名称保证发布目录变化和回滚不会切换媒体/TTS 数据卷。
  agentbot-data:
    name: agentbot-data
