"assets/desktop/agentbot-icon-v2.ico" = "agent_bot/desktop_icon.ico"
"src/static" = "agent_bot/static"
"src/resources" = "agent_bot/resources"
"sql/2026-10-13-unified-call-records.sql" = "agent_bot/resources/2026-10-13-unified-call-records.sql"
