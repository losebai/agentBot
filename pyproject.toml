"sql/2026-10-17-material-memory.sql" = "agent_bot/resources/2026-10-17-material-memory.sql"
"sql/2026-10-17-material-memory.sqlite.sql" = "agent_bot/resources/2026-10-17-material-memory.sqlite.sql"
