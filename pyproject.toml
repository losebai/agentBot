"sql/2026-10-20-retire-ai-session.sqlite.sql" = "agent_bot/resources/2026-10-20-retire-ai-session.sqlite.sql"
"sql/2026-10-20-merge-tagged-memory.sql" = "agent_bot/resources/2026-10-20-merge-tagged-memory.sql"
"sql/2026-10-20-merge-tagged-memory.sqlite.sql" = "agent_bot/resources/2026-10-20-merge-tagged-memory.sqlite.sql"
"sql/2026-10-20-retire-legacy-tagged-memory.sql" = "agent_bot/resources/2026-10-20-retire-legacy-tagged-memory.sql"
"sql/2026-10-20-retire-legacy-tagged-memory.sqlite.sql" = "agent_bot/resources/2026-10-20-retire-legacy-tagged-memory.sqlite.sql"
